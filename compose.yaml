# docker compose up -d  — Bloki behind Caddy, which gets the HTTPS certificate for $DOMAIN and passes WebSockets through.
services:
  bloki:
    build: .
    restart: unless-stopped
    environment:
      BLOKI_SECURE_COOKIE: "1"
      BLOKI_TRUST_PROXY: "1"
      BLOKI_URL: https://${DOMAIN}
      # Optional email: set these in .env too (see README → Email).
      BLOKI_SMTP_URL: ${BLOKI_SMTP_URL:-}
      BLOKI_MAIL_FROM: ${BLOKI_MAIL_FROM:-}
      # Optional single sign-on (see README → Single sign-on).
      BLOKI_OIDC_ISSUER: ${BLOKI_OIDC_ISSUER:-}
      BLOKI_OIDC_CLIENT_ID: ${BLOKI_OIDC_CLIENT_ID:-}
      BLOKI_OIDC_CLIENT_SECRET: ${BLOKI_OIDC_CLIENT_SECRET:-}
      BLOKI_OIDC_AUTO_JOIN: ${BLOKI_OIDC_AUTO_JOIN:-}
    volumes:
      - bloki:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. DOMAIN=bloki.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
volumes:
  bloki:
  caddy:
