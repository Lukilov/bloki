<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; frame-src 'self' about:">
<title>Offline</title>
<style>
  /* Read pages kept with "Available offline" while the server can't be reached. Colours follow Bloki's palette. */
  :root { --bg: #fff; --side: rgb(249, 248, 247); --text: rgb(44, 44, 43); --muted: rgb(125, 122, 117); --line: rgba(55, 53, 47, 0.09); --hover: rgba(33, 27, 23, 0.051); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #191919; --side: #202020; --text: rgb(240, 239, 237); --muted: rgb(155, 155, 155); --line: rgba(255, 255, 255, 0.094); --hover: rgba(255, 255, 255, 0.055); } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  aside { width: 248px; flex: none; background: var(--side); box-shadow: var(--line) -1px 0 0 inset; display: flex; flex-direction: column; overflow: auto; }
  .head { padding: 14px 14px 8px; }
  .head b { display: block; font-size: 14px; }
  .head span { color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 1px 6px; padding: 0 8px; height: 30px; border: none; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .row:hover, .row.on { background: var(--hover); }
  .row .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .foot { margin-top: auto; padding: 10px; display: flex; gap: 6px; }
  .foot button { flex: 1; font: inherit; font-weight: 500; border: none; border-radius: 6px; padding: 6px; cursor: pointer; background: rgb(35, 131, 226); color: #fff; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .banner { padding: 8px 16px; font-size: 13px; color: var(--muted); box-shadow: var(--line) 0 -1px 0 inset; }
  iframe { flex: 1; border: none; width: 100%; background: var(--bg); }
  .empty { margin: auto; color: var(--muted); }
</style>
</head>
<body>
<aside>
  <div class="head"><b>Available offline</b><span id="server"></span></div>
  <div id="list"></div>
  <div class="foot"><button id="retry">Try again</button></div>
</aside>
<main>
  <div class="banner">You’re offline, so these saved copies are read-only. Changes resume once Bloki can reach the server.</div>
  <div class="empty" id="empty">Pick a page on the left.</div>
  <iframe id="view" sandbox="" hidden title="Saved page"></iframe>
</main>
<script>
  const q = new URLSearchParams(location.search)
  const api = window.blokiDesktop.offline
  document.getElementById('server').textContent = q.get('server') || ''
  document.getElementById('retry').onclick = () => api.retry(q.get('url') || q.get('server'))
  const view = document.getElementById('view')
  // The saved HTML is shown in a sandboxed frame with no scripts and nothing loaded from the network.
  const frame = html => '<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:">'
    + '<style>body{font:16px/1.6 ui-sans-serif,-apple-system,system-ui,sans-serif;max-width:708px;margin:48px auto;padding:0 24px;color:' + getComputedStyle(document.body).color + ';background:' + getComputedStyle(document.body).backgroundColor + '}img{max-width:100%}pre{white-space:pre-wrap}li>p{margin:0}li:has(>input[type=checkbox]),li:has(>div>input[type=checkbox]){list-style:none;display:flex;gap:8px;align-items:center}blockquote{margin:0;padding-left:14px;border-left:3px solid currentColor}hr{border:none;border-top:1px solid rgba(127,127,127,.3)}a{color:inherit}</style>' + html
  async function open(id, btn) {
    const p = await api.get(id)
    if (!p) return
    document.querySelectorAll('.row').forEach(r => r.classList.toggle('on', r === btn))
    document.getElementById('empty').hidden = true
    view.hidden = false
    view.srcdoc = frame(p.html)
  }
  api.list().then(pages => {
    const list = document.getElementById('list')
    for (const p of pages) {
      const b = document.createElement('button')
      b.className = 'row'
      const icon = document.createElement('span'); icon.textContent = p.icon || '📄'
      const t = document.createElement('span'); t.className = 't'; t.textContent = p.title || 'Untitled'
      b.append(icon, t)
      b.onclick = () => open(p.id, b)
      list.append(b)
    }
    const want = (q.get('url') || '').split('#/')[1]
    const first = pages.find(p => p.id === want) || pages[0]
    if (first) open(first.id, list.children[pages.indexOf(first)])
  })
  addEventListener('online', () => api.retry(q.get('url') || q.get('server')))
</script>
</body>
</html>
